apiVersion: 1

providers:
  - name: SentinelGuard
    orgId: 1
    folder: SentinelGuard
    folderUid: sentinelguard
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
