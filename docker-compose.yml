services:
  api:
    build: .
    restart: unless-stopped
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - BEDROCK_VLM_MODEL_ID=${BEDROCK_VLM_MODEL_ID:-anthropic.claude-3-5-sonnet-20240620-v1:0}
      - BEDROCK_VLM_ENABLED=${BEDROCK_VLM_ENABLED:-1}
      - CHEQUE_VLM_BACKEND=${CHEQUE_VLM_BACKEND:-auto}
      - CHEQUE_MAX_IMAGE_MB=${CHEQUE_MAX_IMAGE_MB:-8}
      - CHEQUE_AUDIT_PATH=${CHEQUE_AUDIT_PATH:-models/cheque_audit.jsonl}
      - ONLINE_MODEL_PATH=${ONLINE_MODEL_PATH:-models/online_model.pkl}
      - ONLINE_EVENT_LOG=${ONLINE_EVENT_LOG:-models/online_events.jsonl}
      - ONLINE_BOOTSTRAP_PATH=${ONLINE_BOOTSTRAP_PATH:-data/transactions.csv}
      - FEDERATED_REPORT_PATH=${FEDERATED_REPORT_PATH:-models/federated_report.json}
      # Bare names are passed only when set on the host / in .env.
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  dashboard:
    build: .
    restart: unless-stopped
    command: >
      streamlit run app/streamlit_app.py
      --server.port 8501 --server.address 0.0.0.0 --server.headless true
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    depends_on: [api]

  grafana:
    image: grafana/grafana:11.5.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-sentinelguard}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sentinelguard.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  prometheus-data:
  grafana-data:
